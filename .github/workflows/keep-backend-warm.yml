name: Keep backend warm

# Render's free plan sleeps after 15 idle minutes; a ping every 10 minutes
# avoids the ~1 minute cold start for shoppers.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            "https://ivy-backend-fdqs.onrender.com/api/health" || true
